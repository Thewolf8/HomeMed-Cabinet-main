name: 🏗️ Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # تشغيل يدوي من واجهة GitHub

jobs:
  build:
    name: HomeMed Cabinet APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      # ── 1. تحميل الكود ────────────────────────────────────────
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (مطلوب لـ Android Gradle Plugin 8.x) ──────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # ── 3. Node.js ────────────────────────────────────────────
      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ── 4. تثبيت المكتبات ─────────────────────────────────────
      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🔧 Install Capacitor CLI v8
        run: npm install --no-save @capacitor/cli@^8

      # ── 5. بناء تطبيق React (تم التعديل هنا لتخطي فحص TS الصارم) ───
      - name: 🔨 Build web app
        run: npx vite build

      # ── 6. مزامنة Capacitor مع Android ───────────────────────
      - name: 🔄 Capacitor sync → Android
        run: npx cap sync android

      # ── 7. توليد أيقونات التطبيق من assets/icon.png ──────────
      #      يُنشئ جميع كثافات mipmap المطلوبة
      - name: 🎨 Generate app icons (ImageMagick)
        run: |
          ICON="assets/icon.png"
          RES="android/app/src/main/res"

          # density : launcher_px : foreground_px (للـ adaptive icon)
          for entry in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
            density="${entry%%:*}"
            rest="${entry#*:}"
            launcher="${rest%%:*}"
            fg="${rest#*:}"
            dir="$RES/mipmap-$density"

            # أيقونة قياسية
            convert "$ICON" \
              -resize "${launcher}x${launcher}" \
              -gravity center -background none \
              -extent "${launcher}x${launcher}" \
              "$dir/ic_launcher.png"

            # أيقونة مستديرة
            convert "$ICON" \
              -resize "${launcher}x${launcher}" \
              -gravity center -background none \
              -extent "${launcher}x${launcher}" \
              "$dir/ic_launcher_round.png"

            # طبقة أمامية للـ Adaptive Icon (API 26+)
            convert "$ICON" \
              -resize "${fg}x${fg}" \
              -gravity center -background none \
              -extent "${fg}x${fg}" \
              "$dir/ic_launcher_foreground.png"
          done

      # ══════════════════════════════════════════════════════════
      #  8a. بناء موقّع (release) — يعمل فقط إن أضفت الأسرار
      # ══════════════════════════════════════════════════════════

      - name: 🔑 Decode signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/keystore.jks

      - name: 📱 Build signed release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/android/app/keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # ══════════════════════════════════════════════════════════
      #  8b. بناء debug — بدون توقيع (للاختبار)
      # ══════════════════════════════════════════════════════════

      - name: 📱 Build debug APK
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # ── 9. رفع الـ APK كـ artifact ────────────────────────────
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeMed-Cabinet-v1.0.2
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
