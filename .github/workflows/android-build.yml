name: 🏗️ Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # تشغيل يدوي من واجهة GitHub

jobs:
  build:
    name: HomeMed Cabinet APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    
    # تمرير السر إلى متغير بيئة لتفادي خطأ الجيتهاب الشهير
    env:
      KEYSTORE_BASE64_ENV: ${{ secrets.KEYSTORE_BASE64 }}

    steps:

      # ── 1. تحميل الكود ────────────────────────────────────────
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 21 (تمت إعادتها إلى 21 لحل مشكلة المترجم) ──────
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # ── 3. Node.js ────────────────────────────────────────────
      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ── 4. تثبيت المكتبات ─────────────────────────────────────
      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🔧 Install Capacitor CLI v8
        run: npm install --no-save @capacitor/cli@^8

      # ── 5. بناء تطبيق React (متخطي فحص TS الصارم) ─────────────
      - name: 🔨 Build web app
        run: npx vite build

      # ── 6. مزامنة Capacitor مع Android ───────────────────────
      - name: 🔄 Capacitor sync → Android
        run: npx cap sync android

      # ── 7. توليد أيقونات التطبيق تلقائياً من Assets ──────────────
      - name: 🎨 Generate app icons from Assets
        run: |
          npm install @capacitor/assets
          npx @capacitor/assets generate --android

      # ══════════════════════════════════════════════════════════
      #  8a. بناء موقّع (release) — يعمل فقط عند توفر الأسرار
      # ══════════════════════════════════════════════════════════

      - name: 🔑 Decode signing keystore
        if: env.KEYSTORE_BASE64_ENV != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/keystore.jks

      - name: 📱 Build signed release APK
        if: env.KEYSTORE_BASE64_ENV != ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/android/app/keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # ══════════════════════════════════════════════════════════
      #  8b. بناء debug — بدون توقيع (في حال غياب الأسرار)
      # ══════════════════════════════════════════════════════════

      - name: 📱 Build debug APK
        if: env.KEYSTORE_BASE64_ENV == ''
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # ── 9. رفع الـ APK كـ artifact ────────────────────────────
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeMed-Cabinet-v1.0.2
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
